  gatekeeper:
    enabled:
      description: You can enable or disable Strelka gatekeeper.
      forcedType: bool
      helpLink: strelka
  rules:
    enabled:
      description: Boolean that determines if yara rules sync from the Salt manager to the backend nodes.
      forcedType: bool
      readonly: False
      global: False
      helpLink: strelka
      advanced: False
  filecheck:
    historypath:
      description: The path for previously scanned files.
      readonly: True
      global: False
      helpLink: strelka
      advanced: True
    strelkapath:
      description: The path for unprocessed files.
      readonly: True
      global: False
      helpLink: strelka
      advanced: True
    logfile:
      description: The path for the filecheck log.
      readonly: False
      global: False
      helpLink: strelka
      advanced: True

