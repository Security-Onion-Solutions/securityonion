telegraf:
  enabled: False
  output: INFLUXDB
  config:
    interval: '30s'
    metric_batch_size: 1000
    metric_buffer_limit: 10000
    collection_jitter: '0s'
    flush_interval: '10s'
    flush_jitter: '0s'
    debug: false
    quiet: false
  container_stats:
    tags:
      identity: False
    engine:
      n_containers: False
      n_containers_running: False
      n_containers_stopped: False
      n_containers_paused: False
      n_images: False
      n_cpus: False
      n_goroutines: False
      n_used_file_descriptors: False
      n_listener_events: False
      memory_total: False
    cpu:
      usage_percent: True
      usage_total: False
      usage_in_usermode: False
      usage_in_kernelmode: False
      usage_system: False
      throttling_periods: False
      throttling_throttled_periods: False
      throttling_throttled_time: False
      container_id: False
    mem:
      usage_percent: True
      usage: False
      limit: False
      max_usage: False
      active_anon: False
      active_file: False
      inactive_anon: False
      inactive_file: False
      unevictable: False
      pgfault: False
      pgmajfault: False
      container_id: False
    net:
      rx_bytes: True
      rx_packets: False
      rx_errors: False
      rx_dropped: False
      tx_bytes: False
      tx_packets: False
      tx_errors: False
      tx_dropped: False
      container_id: False
    blkio:
      io_service_bytes_recursive_read: False
      io_service_bytes_recursive_write: False
      container_id: False
    status:
      uptime_ns: True
      oomkilled: True
      pid: False
      exitcode: False
      restart_count: False
      started_at: False
      finished_at: False
      container_id: False
    health:
      health_status: False
      failing_streak: False
  scripts:
    eval:
      - agentstatus.sh
      - checkfiles.sh
      - influxdbsize.sh
      - lasthighstate.sh
      - oldpcap.sh
      - os.sh
      - raid.sh
      - containers.sh
      - sostatus.sh
      - suriloss.sh
      - surirules.sh
      - zeekcaptureloss.sh
      - zeekloss.sh
    standalone:
      - agentstatus.sh
      - checkfiles.sh
      - eps.sh
      - influxdbsize.sh
      - lasthighstate.sh
      - oldpcap.sh
      - os.sh
      - raid.sh
      - redis.sh
      - containers.sh
      - sostatus.sh
      - suriloss.sh
      - surirules.sh
      - zeekcaptureloss.sh
      - zeekloss.sh
      - features.sh
    manager:
      - agentstatus.sh
      - influxdbsize.sh
      - lasthighstate.sh
      - os.sh
      - raid.sh
      - redis.sh
      - containers.sh
      - sostatus.sh
      - features.sh
    managerhype:
      - agentstatus.sh
      - influxdbsize.sh
      - lasthighstate.sh
      - os.sh
      - raid.sh
      - redis.sh
      - containers.sh
      - sostatus.sh
      - features.sh
    managersearch:
      - agentstatus.sh
      - eps.sh
      - influxdbsize.sh
      - lasthighstate.sh
      - os.sh
      - raid.sh
      - redis.sh
      - containers.sh
      - sostatus.sh
      - features.sh
    import:
      - influxdbsize.sh
      - lasthighstate.sh
      - os.sh
      - containers.sh
      - sostatus.sh
    sensor:
      - checkfiles.sh
      - lasthighstate.sh
      - oldpcap.sh
      - os.sh
      - raid.sh
      - containers.sh
      - sostatus.sh
      - suriloss.sh
      - surirules.sh
      - zeekcaptureloss.sh
      - zeekloss.sh
      - features.sh
    heavynode:
      - checkfiles.sh
      - eps.sh
      - lasthighstate.sh
      - oldpcap.sh
      - os.sh
      - raid.sh
      - redis.sh
      - containers.sh
      - sostatus.sh
      - suriloss.sh
      - surirules.sh
      - zeekcaptureloss.sh
      - zeekloss.sh
    idh:
      - lasthighstate.sh
      - os.sh
      - containers.sh
      - sostatus.sh
    searchnode:
      - eps.sh
      - lasthighstate.sh
      - os.sh
      - raid.sh
      - containers.sh
      - sostatus.sh
      - features.sh
    receiver:
      - eps.sh
      - lasthighstate.sh
      - os.sh
      - raid.sh
      - redis.sh
      - containers.sh
      - sostatus.sh
    fleet:
      - lasthighstate.sh
      - os.sh
      - containers.sh
      - sostatus.sh
    hypervisor:
      - lasthighstate.sh
      - os.sh
      - containers.sh
      - sostatus.sh
    desktop:
      - lasthighstate.sh
      - os.sh
      - containers.sh
      - sostatus.sh
