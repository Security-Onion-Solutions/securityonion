        - .ds-logs-auditd.log-*
        - .ds-logs-import-so-*
      rule_conditions:
      - type: logsource
        product: linux
        service: auditd
    - id: esql_index_network
      type: set_state
      key: index
      val:
        - .ds-logs-zeek-so-*
        - .ds-logs-suricata-so-*
        - .ds-logs-suricata.alerts-so-*
        - .ds-logs-endpoint.events.network-*
        - .ds-logs-windows.sysmon_operational-*
        - .ds-logs-sysmon_linux.log-*
        - .ds-logs-windows.forwarded-*
        - .ds-logs-import-so-*
      rule_conditions:
      - type: logsource
        category: network
    - id: esql_index_so_network
      type: set_state
      key: index
      val:
        - .ds-logs-zeek-so-*
        - .ds-logs-suricata-so-*
        - .ds-logs-import-so-*
      rule_cond_op: or
      rule_conditions:
      - type: logsource
        category: network
        service: connection
      - type: logsource
        category: network
        service: dns
      - type: logsource
        category: network
        service: http
      - type: logsource
        category: network
        service: file
      - type: logsource
        category: network
        service: x509
      - type: logsource
        category: network
        service: ssl
      - type: logsource
        category: network
        service: ssh
      - type: logsource
        category: dns
    - id: esql_index_zeek
      type: set_state
      key: index
      val:
        - .ds-logs-zeek-so-*
        - .ds-logs-import-so-*
      rule_conditions:
      - type: logsource
        product: zeek
    - id: esql_index_opencanary
      type: set_state
      key: index
      val:
        - .ds-logs-idh-so-*
        - .ds-logs-import-so-*
      rule_conditions:
      - type: logsource
        product: opencanary
    - id: esql_index_kratos
      type: set_state
      key: index
      val:
        - .ds-logs-kratos-so-*
        - .ds-logs-import-so-*
      rule_conditions:
      - type: logsource
        product: kratos

# SOC reads the mapped group-by columns from this output
postprocessing:
    - id: esql_correlation_group_by
      type: template
      template: '{{ {"query": query, "group_by": rule.group_by} | tojson }}'
      rule_conditions:
      - type: is_sigma_correlation_rule
